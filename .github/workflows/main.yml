name: Main CI

# Full suite for main: unit tests + frontend build + Docker container health check.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -q

  frontend-build:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  docker-smoke:
    name: Build backend image & health check
    runs-on: ubuntu-latest
    needs: backend-tests
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finsync
          POSTGRES_PASSWORD: finsync
          POSTGRES_DB: finsync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finsync -d finsync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t finsync-backend:ci ./backend

      - name: Run container (migrate + serve)
        run: |
          docker run -d --name finsync-backend --network host \
            -e DATABASE_URL="postgresql+psycopg://finsync:finsync@localhost:5432/finsync" \
            -e JWT_SECRET_KEY="ci-not-a-real-secret" \
            -e SMS_WEBHOOK_SIGNING_KEY="ci-not-a-real-secret" \
            finsync-backend:ci

      - name: Wait for /health to pass
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "Backend is healthy."
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend did not become healthy in time."
          exit 1

      - name: Dump container logs on failure
        if: failure()
        run: docker logs finsync-backend || true

      - name: Stop container
        if: always()
        run: docker rm -f finsync-backend || true
