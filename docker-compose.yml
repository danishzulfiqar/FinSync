services:
  db:
    image: postgres:16-alpine
    container_name: finsync-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finsync}
      POSTGRES_DB: ${POSTGRES_DB:-finsync}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finsync} -d ${POSTGRES_DB:-finsync}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finsync-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Override host so the container reaches the db service, not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-finsync}:${POSTGRES_PASSWORD:-finsync}@db:5432/${POSTGRES_DB:-finsync}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Mount OAuth token store so refresh tokens survive container restarts.
      - ./backend/secrets:/app/secrets
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Uncomment once the React + Vite frontend is scaffolded (Phase 5).
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: finsync-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     - backend

volumes:
  pgdata:
