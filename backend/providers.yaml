# ==========================================================================
# Provider matching configuration.
#
# IMPORTANT: The sender addresses and subject/body patterns below are
# PLACEHOLDERS. Replace them with your own anonymized real values after you
# inspect your actual notification emails/SMS. The ingestion engine reads
# this file at runtime, so you can change patterns WITHOUT touching code.
#
# Matching is intentionally forgiving:
#   - email_senders / sms_senders: substring match (case-insensitive)
#   - *_subject_patterns / *_body_patterns: Python regex (case-insensitive)
# A message must match a sender AND (optionally) a pattern to be considered
# a candidate transaction for that provider. Final decision is made by the
# provider parser, which returns None for non-transaction messages.
# ==========================================================================

providers:
  hbl:
    display_name: "HBL"
    default_currency: "PKR"
    # HBL outgoing-transaction notifications arrive by email.
    email_senders:
      - "digital.banking@hbl.com"
    email_subject_patterns:
      - "(?i)Transfer to Other Bank"       # funds transfer out
      - "(?i)Mobile Bundle"                # mobile bundle / top-up
      - "(?i)Send Money to Other Bank"     # Raast transfer out
      - "(?i)Bill Payment"                 # utility bill payment
    email_body_patterns: []
    # HBL incoming funds + card/purchase notifications arrive by SMS.
    sms_senders:
      - "14250"
    # Empty = every SMS from the sender reaches the parser, which rejects non-transactions.
    sms_body_patterns: []

  abl:
    display_name: "Allied Bank"
    default_currency: "PKR"
    email_senders:
      - "myabl@abl.com"
    email_subject_patterns:
      - "(?i)Allied Bank Transaction Alert"   # card/account purchases & withdrawals
      - "(?i)myABL Fund Transfer Alert"        # RAAST / funds received & sent
    email_body_patterns: []
    # ABL: no SMS ingestion required.
    sms_senders: []
    sms_body_patterns: []

  nayapay:
    display_name: "NayaPay"
    default_currency: "PKR"
    email_senders:
      - "service@nayapay.com"
    email_subject_patterns:
      - "(?i)^You got Rs"        # money received
      - "(?i)^You sent Rs"       # money sent
      - "(?i)Transaction at "    # card purchase / reversal
    email_body_patterns: []
    # NayaPay: no SMS ingestion required.
    sms_senders: []
    sms_body_patterns: []

# ==========================================================================
# Deterministic categorization rules (no LLM). Keys are matched as
# case-insensitive substrings against merchant + description. First match wins,
# evaluated top-to-bottom. Add your own merchants freely.
# ==========================================================================
categorization:
  default_category: "Other"
  # Category names mirror the FinLens catalog (keyword_rules.py) so email,
  # SMS and statement rows land in the same buckets on the dashboard.
  rules:
    - match: "indrive"
      category: "Fuel & Transport"
    - match: "careem"
      category: "Fuel & Transport"
    - match: "uber"
      category: "Fuel & Transport"
    - match: "foodpanda"
      category: "Food & Dining"
    - match: "netflix"
      category: "Subscriptions"
    - match: "spotify"
      category: "Subscriptions"
    - match: "youtube premium"
      category: "Subscriptions"
    - match: "k-electric"
      category: "Bills & Utilities"
    - match: "ssgc"
      category: "Bills & Utilities"
    - match: "atm"
      category: "Cash & ATM"
    - match: "salary"
      category: "Salary"
