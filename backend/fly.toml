# Fly.io configuration for the FinSync backend.
# Set `app` to your chosen name after `fly launch --no-deploy`.
app = "finsync-backend"
primary_region = "sin"  # Singapore — closest to Pakistan; change if you prefer.

[build]
  dockerfile = "Dockerfile"

# Run database migrations on every deploy, before the new version goes live.
[deploy]
  release_command = "alembic upgrade head"

[env]
  APP_ENV = "production"
  API_V1_PREFIX = "/api/v1"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
